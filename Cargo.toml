[workspace]
members = [
    "crates/api",
    "crates/common",
    "crates/ingestion",
    "crates/mcp",
    "crates/processor",
    "crates/retrieval",
]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Quazmoz/memoryops"
rust-version = "1.88.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# CIDR matching for trusted-proxy IP validation
ipnet = "2"

# General error context and typed errors keep failures explicit across crate boundaries.
anyhow = "1.0"
thiserror = "2.0"

# Async traits let provider interfaces remain object-safe behind Arc<dyn Trait>.
async-trait = "0.1"

# Axum is the required API runtime; tower-http supplies production middleware layers.
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "set-header", "timeout", "trace"] }

# Tokio is the async runtime used by axum, sqlx, Redis, and service workers.
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal"] }

# Serialization, validation, IDs, and time are shared by API payloads and DB models.
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiktoken-rs = "0.12"
toml = "0.8"
uuid = { version = "1.23", features = ["serde", "v5", "v7"] }
validator = { version = "0.20", features = ["derive"] }
async-stream = "0.3"
bytes = "1.10"
futures-util = "0.3"

# sqlx provides parameterized Postgres access and migration embedding.
sqlx = { version = "0.8", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }

# Redis Streams back processor queues and rate limiting; connection-manager gives pooled async handles.
redis = { version = "1.2", features = ["connection-manager", "tokio-comp"] }
deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }

# Webhook signatures and future API key hashing use the crypto primitives pinned for the workspace.
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.13"
bs58 = "0.5"
rand = "0.10"
subtle = "2"
zeroize = "1"

# Qdrant is the required vector search backend and is held in shared AppState.
qdrant-client = "1.18"

# Structured logs are the foundation for request tracing and later OTEL export wiring.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Property-based testing is used for invariant verification in retrieval packing.
proptest = "1"

common = { path = "crates/common" }
ingestion = { path = "crates/ingestion" }
processor = { path = "crates/processor" }
retrieval = { path = "crates/retrieval" }
