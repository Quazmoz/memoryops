<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MemoryOps Settings</title>
  <style>
    body {
      background-color: #1c1b19;
      color: #cdccca;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #cdccca;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .accent {
      color: #01696f;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #cdccca;
    }
    input {
      width: 100%;
      background-color: #171614;
      border: 1px solid #393836;
      color: #cdccca;
      padding: 6px 8px;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #4f98a3;
    }
    button {
      width: 100%;
      background-color: #4f98a3;
      color: #171614;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      font-size: 13px;
    }
    button:hover {
      background-color: #01696f;
      color: #cdccca;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      min-height: 14px;
    }
    .success { color: #4f98a3; }
    .error { color: #fdab43; }
  </style>
</head>
<body>
  <h2><span class="accent">●</span> MemoryOps</h2>
  
  <div class="form-group">
    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:8080">
  </div>
  
  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="mops_...">
  </div>
  
  <div class="form-group">
    <label for="workspaceId">Workspace ID</label>
    <input type="text" id="workspaceId" placeholder="UUID">
  </div>
  
  <button id="saveBtn">Save</button>
  <div id="status"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const apiUrlInput = document.getElementById('apiUrl');
      const apiKeyInput = document.getElementById('apiKey');
      const workspaceIdInput = document.getElementById('workspaceId');
      const saveBtn = document.getElementById('saveBtn');
      const statusDiv = document.getElementById('status');

      // Load settings
      chrome.runtime.sendMessage({ type: "GET_SETTINGS" }, (response) => {
        if (response && response.settings) {
          apiUrlInput.value = response.settings.apiUrl || '';
          apiKeyInput.value = response.settings.apiKey || '';
          workspaceIdInput.value = response.settings.workspaceId || '';
        }
      });

      // Save settings
      saveBtn.addEventListener('click', () => {
        const settings = {
          apiUrl: apiUrlInput.value,
          apiKey: apiKeyInput.value,
          workspaceId: workspaceIdInput.value
        };

        chrome.runtime.sendMessage({ type: "SAVE_SETTINGS", settings: settings }, (response) => {
          if (chrome.runtime.lastError) {
            statusDiv.textContent = "✗ Error: " + chrome.runtime.lastError.message;
            statusDiv.className = 'error';
          } else if (response && response.success === false) {
            statusDiv.textContent = "✗ Error: Failed to save";
            statusDiv.className = 'error';
          } else {
            statusDiv.textContent = "✓ Saved";
            statusDiv.className = 'success';
            setTimeout(() => {
              statusDiv.textContent = "";
            }, 2000);
          }
        });
      });
    });
  </script>
</body>
</html>
