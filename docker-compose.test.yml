services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: memoryops_test
      POSTGRES_USER: memoryops
      POSTGRES_PASSWORD: memoryops
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryops -d memoryops_test"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "16333:6333"
      - "16334:6334"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10