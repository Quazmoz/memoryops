services:
  postgres:
    image: postgres:16
    container_name: memoryops-postgres
    environment:
      POSTGRES_DB: memoryops
      POSTGRES_USER: memoryops
      POSTGRES_PASSWORD: memoryops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoryops -d memoryops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: memoryops-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memoryops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_MEMORYOPS_WORKSPACE_ID: ${VITE_MEMORYOPS_WORKSPACE_ID:-}
    container_name: memoryops-frontend
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/index.html | grep -q '<html' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp:
    build:
      context: .
    command: ["mcp"]
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgres://memoryops:memoryops@postgres:5432/memoryops
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MCP_PORT: "3003"
      MCP_TRANSPORT: "sse"
    depends_on:
      - postgres
      - redis
    profiles:
      - mcp

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
