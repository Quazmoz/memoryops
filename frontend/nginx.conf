server {
    # Port 8080 used by nginxinc/nginx-unprivileged (no CAP_NET_BIND_SERVICE needed)
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime workspace config — generated at container start by entrypoint.sh.
    # Served with no-cache so a restarted container always delivers the latest value.
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Immutable assets (Vite fingerprints these)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy -> backend API service
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_connect_timeout 1s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip /api prefix - trailing slash on proxy_pass handles this
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
