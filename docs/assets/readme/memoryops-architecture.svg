<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs>
<style>
.bg { fill: #0d1117; }
.box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; ry: 8; }
.lane { fill: #0d1117; stroke: #30363d; stroke-width: 1; stroke-dasharray: 5,5; rx: 8; }
.text-title { fill: #c9d1d9; font-family: -apple-system, sans-serif; font-size: 24px; font-weight: bold; }
.text-main { fill: #c9d1d9; font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 500; text-anchor: middle; }
.text-small { fill: #8b949e; font-family: -apple-system, sans-serif; font-size: 14px; text-anchor: middle; }
.text-left { fill: #c9d1d9; font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 500; text-anchor: start; }
.arrow { stroke: #58a6ff; stroke-width: 2; fill: none; }
.arrow-head { fill: #58a6ff; }
.node-cyan { fill: #0d1117; stroke: #00e5ff; stroke-width: 2; rx: 8; }
.node-purple { fill: #0d1117; stroke: #9d4edd; stroke-width: 2; rx: 8; }
.node-green { fill: #0d1117; stroke: #00e676; stroke-width: 2; rx: 8; }
.node-amber { fill: #0d1117; stroke: #ffab00; stroke-width: 2; rx: 8; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
</marker>
