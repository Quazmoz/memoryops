# MCP is a separate transport, not a REST surface; see docs/SPEC.md § MCP Server.
openapi: 3.1.0
info:
  title: MemoryOps API
  version: 0.21.0
  description: Control plane API for AI-agent memory ingestion, lifecycle management, retrieval, and audit.
  contact:
    name: MemoryOps
    url: https://github.com/Quazmoz/memoryops
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
tags:
  - name: Webhooks
  - name: Observations
  - name: Memory
  - name: Retrieval
  - name: Workspaces
  - name: API Keys
  - name: Audit
  - name: DLQ
  - name: Export
  - name: Tags
  - name: Skills
  - name: Contradictions
  - name: Health
paths:
  /v1/ingest/github/{workspace_id}:
    post:
      tags: [Webhooks]
      operationId: ingestGitHub
      summary: Receive a GitHub webhook event
      description: Validates the workspace integration GitHub signature and accepts supported repository events for ingestion.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookWorkspaceId'
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ingest/slack/{workspace_id}:
    post:
      tags: [Webhooks]
      operationId: ingestSlack
      summary: Receive a Slack Events API webhook
      description: Validates the workspace integration Slack signature and accepts supported workspace events for ingestion.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookWorkspaceId'
        - name: X-Slack-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackEventEnvelope'
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ingest/linear/{workspace_id}:
    post:
      tags: [Webhooks]
      operationId: ingestLinear
      summary: Receive a Linear webhook event
      description: Accepts supported Linear Issue, Comment, Project, and Cycle events. Requires and validates X-Linear-Signature against the workspace integration signing secret.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookWorkspaceId'
        - name: X-Linear-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ingest/jira/{workspace_id}:
    post:
      tags: [Webhooks]
      operationId: ingestJira
      summary: Receive a Jira Cloud admin webhook event
      description: Validates the workspace integration X-Hub-Signature and accepts supported issue and comment events for ingestion. Jira Connect JWT webhooks are not supported in M10.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookWorkspaceId'
        - name: X-Hub-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Event accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/ingest/observation:
    post:
      tags: [Observations]
      operationId: ingestObservation
      summary: Ingest an agent-authored observation
      description: >
        Accepts a structured observation from any first-party agent or automation.
        Authenticated by workspace API key (X-API-Key). Idempotent per
        (workspace_id, agent_id, content) using SHA-256. Enqueues to the processor
        pipeline and writes an audit record. Returns 202 Accepted immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRequest'
            example:
              workspace_id: "018f1234-0000-7000-8000-000000000000"
              content: "Deployment completed in 142 s. All health checks passed."
              agent_id: "deploy-bot"
              user_id: "quinn"
              repo: "org/backend"
              tags: ["deploy", "ci"]
              importance: 0.75
              source_ref: "run/8821"
      responses:
        '202':
          description: Observation accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '413':
          description: Observation body exceeds the configured 1 MiB limit
  /v1/memory:
    get:
      tags: [Memory]
      operationId: listMemory
      summary: List memory units
      description: Returns cursor-paginated memory units filtered within the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MemoryType'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/Source'
        - name: source_ref
          in: query
          schema:
            type: string
          description: >-
            Filter to memories derived from a specific source file. Matches the
            `source_ref` recorded on linked raw events, ignoring any
            `#Lstart-Lend` line anchor (e.g. `src/foo.rs` matches
            `src/foo.rs#L10-L20`).
        - name: tag
          in: query
          schema:
            type: string
        - name: entity
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: as_of
          in: query
          schema:
            type: string
            format: date-time
          description: Reconstruct memory state and decay scores as of this timestamp.
      responses:
        '200':
          description: Paginated memory units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/memory/{id}:
    get:
      tags: [Memory]
      operationId: getMemory
      summary: Get a memory unit
      description: Returns one memory unit by ID within the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Memory]
      operationId: updateMemory
      summary: Update memory content, tags, pin state, or importance
      description: Mutates editable memory fields and records version or audit data as needed.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryPatchRequest'
      responses:
        '200':
          description: Updated memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memory]
      operationId: deleteMemory
      summary: Soft-delete a memory unit
      description: Marks a memory unit as deleted without immediately removing stored history.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '204':
          description: Memory unit soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/search:
    post:
      tags: [Memory]
      operationId: searchMemory
      summary: Search memory units
      description: Runs keyword, vector, or hybrid search with scope, point-in-time, and workspace-pool filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Ranked memory search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/memory/{id}/promote:
    post:
      tags: [Memory]
      operationId: promoteMemory
      summary: Promote an episodic memory to semantic memory
      description: Forces promotion of an episodic memory into a semantic memory unit.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Promoted memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/{id}/publish:
    post:
      tags: [Memory]
      operationId: publishMemory
      summary: Publish semantic memory to the workspace pool
      description: Sets scope_visibility to workspace for a semantic memory and writes a publish audit entry.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Published memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/memory/{id}/restore:
    post:
      tags: [Memory]
      operationId: restoreMemory
      summary: Restore a soft-deleted memory unit
      description: Clears the soft-delete timestamp for a recoverable memory unit.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Restored memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/{id}/history:
    get:
      tags: [Memory]
      operationId: listMemoryHistory
      summary: List memory version history
      description: Returns version rows created before semantic memory edits.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Memory versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemoryVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/bulk:
    post:
      tags: [Memory]
      operationId: bulkUpdateMemory
      summary: Bulk pin or delete memory units
      description: Applies a supported bulk lifecycle action to selected memory units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMemoryRequest'
      responses:
        '200':
          description: Bulk operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkMemoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/memory/merge:
    post:
      tags: [Memory]
      operationId: mergeMemory
      summary: Merge semantic memory units
      description: Combines semantic memory units into a single versioned memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryMergeRequest'
      responses:
        '200':
          description: Merged memory unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/retrieve:
    post:
      tags: [Retrieval]
      operationId: retrieveMemory
      summary: Retrieve token-packed memory context
      description: Runs scoped hybrid retrieval and returns packed memories with a trace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalRequest'
      responses:
        '200':
          description: Retrieval result with trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/retrieve/trace/{query_id}:
    get:
      tags: [Retrieval]
      operationId: getRetrievalTrace
      summary: Get a persisted retrieval trace
      description: Returns the scoring and packing trace for a previously executed retrieval query.
      parameters:
        - $ref: '#/components/parameters/QueryId'
      responses:
        '200':
          description: Retrieval trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalTraceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: Creates a tenant workspace that owns memory, keys, integrations, and configuration. Requires the workspace creation secret in the x-admin-token header.
      security:
        - AdminTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/me:
    get:
      tags: [Workspaces]
      operationId: getCurrentWorkspace
      summary: Get the authenticated workspace
      description: Returns workspace metadata and configuration for the workspace bound to the API key.
      responses:
        '200':
          description: Current workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get a workspace
      description: Returns workspace metadata and configuration for the authenticated tenant.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: Soft-deletes the authenticated workspace and removes associated vector points.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '204':
          description: Workspace deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/stats:
    get:
      tags: [Workspaces]
      operationId: getWorkspaceStats
      summary: Get workspace statistics
      description: Returns aggregate memory counts and scoring statistics for the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/stats/history:
    get:
      tags: [Workspaces]
      operationId: getWorkspaceStatsHistory
      summary: Get workspace stats history
      description: Returns daily created, promoted, and soft-deleted memory counts for the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Workspace activity history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStatsHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/tags:
    get:
      tags: [Tags]
      operationId: listWorkspaceTags
      summary: List workspace tags
      description: Returns tag names and counts for non-deleted memories in the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workspace tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workspaces/{id}/metrics:
    get:
      tags: [Workspaces]
      operationId: getWorkspaceMetrics
      summary: Get workspace metrics
      description: Placeholder route; per-workspace metrics are not implemented until process-global metrics are partitioned by workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/config:
    patch:
      tags: [Workspaces]
      operationId: updateWorkspaceConfig
      summary: Update workspace configuration
      description: Updates workspace-level provider, scoring, lifecycle, and rate-limit configuration.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Workspace configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/promote:
    post:
      tags: [Workspaces]
      operationId: promoteWorkspace
      summary: Start a workspace promotion pass
      description: Starts a workspace-scoped semantic promotion pass if no promotion lock is already held.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '202':
          description: Promotion pass started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePromotionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{id}/import:
    post:
      tags: [Workspaces]
      operationId: importWorkspaceMemory
      summary: Import workspace memories
      description: Imports newline-delimited JSON memory records into the authenticated workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportMemoriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workspaces/{workspace_id}/forget/user/{user_id}:
    delete:
      tags: [Workspaces]
      operationId: forgetUserData
      summary: Forget user data
      description: Soft-deletes or hard-purges memories scoped to a user according to workspace compliance configuration.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User erasure summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workspaces/{id}/reindex:
    post:
      tags: [Workspaces]
      operationId: reindexWorkspace
      summary: Reindex workspace memories
      description: Enqueues memories missing embeddings for re-embedding. When force is true, embedding IDs are cleared before enqueueing.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: after
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reindex enqueue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workspaces/{id}/skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List workspace skills
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspace skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a workspace skill
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillWriteRequest'
      responses:
        '200':
          description: Skill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/workspaces/{id}/skills/{name}:
    get:
      tags: [Skills]
