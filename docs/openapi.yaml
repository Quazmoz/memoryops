      description: Streams memory units as JSONL while excluding raw event payloads and embeddings.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: JSONL memory export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/memory/{id}/provenance:
    get:
      tags: [Memory]
      operationId: getMemoryProvenance
      summary: Get memory provenance graph
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provenance graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/{id}/feedback:
    get:
      tags: [Memory]
      operationId: listMemoryFeedback
      summary: List retrieval feedback for a memory
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Retrieval feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Memory]
      operationId: submitMemoryFeedback
      summary: Submit retrieval feedback for a memory
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '200':
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Liveness check
      description: Confirms the API process is alive.
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Dependency readiness check
      description: Checks whether the API can reach Postgres, Redis, and Qdrant.
      security: []
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/system:
    get:
      tags: [Health]
      operationId: systemHealth
      summary: Structured system health check
      description: Returns dependency health checks with latency and diagnostic messages.
      security: []
      responses:
        '200':
          description: System health details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminTokenAuth:
      type: apiKey
      in: header
      name: x-admin-token
  parameters:
    After:
      name: after
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookWorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryId:
      name: query_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: name
      in: path
      required: true
      schema:
        type: string
    FlagId:
      name: flag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated credentials do not allow this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Request is syntactically valid but cannot be applied to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Feature is not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ObservationRequest:
      type: object
      required: [workspace_id, content, agent_id]
      properties:
        workspace_id:
          type: string
          format: uuid
          description: Workspace to ingest into
        content:
          type: string
          minLength: 1
          maxLength: 8000
          description: Observation text
        agent_id:
          type: string
          description: Identifier of the agent authoring this observation
        user_id:
          type: string
          description: Optional user context
        repo:
          type: string
          description: Optional repository context (e.g. "org/repo")
        tags:
          type: array
          maxItems: 20
          items:
            type: string
          description: Optional tags to attach to the resulting memory
        importance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Override importance score (0.0–1.0). Omit to use rule-table scoring.
        source_ref:
          type: string
          description: Optional external reference (e.g. run id, URL)
    ObservationAccepted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
          description: Raw event id
        status:
          type: string
          enum: [queued]
    WebhookAccepted:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
    SlackEventEnvelope:
      oneOf:
        - $ref: '#/components/schemas/SlackUrlVerification'
        - $ref: '#/components/schemas/SlackEventCallback'
    SlackUrlVerification:
      type: object
      required: [type, challenge]
      properties:
        type:
          type: string
          enum: [url_verification]
        challenge:
          type: string
    SlackEventCallback:
      type: object
      required: [type, event]
      properties:
        type:
          type: string
          enum: [event_callback]
        event:
          oneOf:
            - $ref: '#/components/schemas/SlackMessageEvent'
            - $ref: '#/components/schemas/SlackReactionEvent'
    SlackMessageEvent:
      type: object
      required: [type, channel, user, text, ts]
      properties:
        type:
          type: string
          enum: [message, app_mention]
        subtype:
          type: [string, 'null']
          enum: [message_changed, null]
        channel:
          type: string
        user:
          type: string
        text:
          type: string
        ts:
          type: string
        thread_ts:
          type: [string, 'null']
        message:
          type: object
          additionalProperties: true
    SlackReactionEvent:
      type: object
      required: [type, user, reaction, item]
      properties:
        type:
          type: string
          enum: [reaction_added]
        user:
          type: string
        reaction:
          type: string
        item:
          type: object
          required: [channel, ts]
          properties:
            channel:
              type: string
            ts:
              type: string
    WorkspacePromotionResponse:
      type: object
      required: [workspace_id, clusters_found, units_promoted, units_skipped]
      properties:
        workspace_id:
          type: string
          format: uuid
        clusters_found:
          type: integer
          minimum: 0
        units_promoted:
          type: integer
          minimum: 0
        units_skipped:
          type: integer
          minimum: 0
    Source:
      type: string
      enum: [github, slack, jira, linear]
    MemoryType:
      type: string
      enum: [episodic, semantic]
    ScopeVisibility:
      type: string
      enum: [private, workspace]
    SearchMode:
      type: string
      enum: [hybrid, vector, keyword]
    EntityType:
      type: string
      enum: [person, repo, branch, topic, file, team]
    AuditAction:
      type: string
      enum:
        - memory_created
        - memory_edited
        - memory_deleted
        - memory_restored
        - memory_pinned
        - memory_unpinned
        - memory_promoted
        - memory_merged
        - importance_overridden
        - key_created
        - key_revoked
        - workspace_config_updated
        - publish
        - integration_added
        - integration_removed
    IntegrationStatus:
      type: string
      enum: [active, degraded, failing]
    MemoryScope:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          format: uuid
        source:
          type: string
        actor:
          type: string
        agent_id:
          type: [string, 'null']
        user_id:
          type: [string, 'null']
        repo:
          type: [string, 'null']
    Entity:
      type: object
      required: [entity_type, value, confidence]
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        value:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
    MemoryUnit:
      type: object
      required:
        - id
        - workspace_id
        - scope
        - memory_type
        - scope_visibility
        - content
        - entities
        - importance_score
        - importance_overridden
        - source_events
        - decay_score
        - pinned
        - tags
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/MemoryScope'
        memory_type:
          $ref: '#/components/schemas/MemoryType'
        scope_visibility:
          $ref: '#/components/schemas/ScopeVisibility'
        content:
          type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        importance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        importance_overridden:
          type: boolean
        source_events:
          type: array
          items:
            type: string
            format: uuid
        embedding_id:
          type: [string, 'null']
        token_count:
          type: [integer, 'null']
        decay_score:
          type: number
          format: float
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
        deleted_at:
          type: [string, 'null']
          format: date-time
        last_accessed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryVersion:
      type: object
      required: [id, memory_id, workspace_id, version, content, importance_score, tags, edited_by, created_at]
      properties:
        id:
