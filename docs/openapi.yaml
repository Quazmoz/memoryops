          description: Required signing secret for webhook signature validation.
    IntegrationHealth:
      type: object
      required: [workspace_id, source, events_24h, errors_24h, status]
      properties:
        workspace_id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/Source'
        last_event_at:
          type: [string, 'null']
          format: date-time
        events_24h:
          type: integer
        errors_24h:
          type: integer
        status:
          $ref: '#/components/schemas/IntegrationStatus'
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    ApiKeyCreateResponse:
      type: object
      required: [key, api_key]
      properties:
        key:
          type: string
        api_key:
          $ref: '#/components/schemas/ApiKey'
    ApiKey:
      type: object
      required: [id, workspace_id, name, prefix, created_at, revoked]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: [string, 'null']
          format: date-time
    AuditEntry:
      type: object
      required: [id, workspace_id, actor, action, target_id, target_type, occurred_at, severity, success]
      description: >-
        A single audit record. All JSON payload fields (diff/before/after/metadata)
        are recursively redacted and size-bounded before persistence and again on
        read, so secret values are never present.
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        target_id:
          type: string
          format: uuid
        target_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        severity:
          type: string
          enum: [info, notice, warning, critical]
        success:
          type: boolean
        category:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
        correlation_id:
          type: [string, 'null']
        actor_type:
          type: [string, 'null']
        actor_id:
          type: [string, 'null']
        actor_display:
          type: [string, 'null']
        api_key_id:
          type: [string, 'null']
          format: uuid
        api_key_prefix:
          type: [string, 'null']
        source_ip:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        route:
          type: [string, 'null']
        method:
          type: [string, 'null']
        status_code:
          type: [integer, 'null']
        reason:
          type: [string, 'null']
        target_name:
          type: [string, 'null']
        target_version:
          type: [integer, 'null']
        error_code:
          type: [string, 'null']
        diff:
          type: [object, 'null']
          additionalProperties: true
        before:
          type: [object, 'null']
          additionalProperties: true
        after:
          type: [object, 'null']
          additionalProperties: true
        metadata:
          type: [object, 'null']
          additionalProperties: true
        seq:
          type: [integer, 'null']
          format: int64
          description: Per-workspace hash-chain sequence number (null for legacy rows).
        prev_hash:
          type: [string, 'null']
        hash:
          type: [string, 'null']
          description: HMAC-SHA256 over the canonical row + prev_hash (tamper-evidence).
    AuditListResponse:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        limit:
          type: integer
        offset:
          type: integer
        next_cursor:
          type: [string, 'null']
    AuditActionInfo:
      type: object
      required: [name, category, default_severity, required]
      properties:
        name:
          type: string
        category:
          type: string
        default_severity:
          type: string
          enum: [info, notice, warning, critical]
        required:
          type: boolean
          description: Whether this action uses the reliable (synchronous) write path.
    AuditActionsResponse:
      type: object
      required: [actions, severities, categories]
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AuditActionInfo'
        severities:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
    AuditChainVerification:
      type: object
      required: [enabled, verified, checked, message]
      properties:
        enabled:
          type: boolean
          description: Whether the tamper-evident hash chain is active (signing key configured).
        verified:
          type: boolean
        checked:
          type: integer
          format: int64
        first_broken_seq:
          type: [integer, 'null']
          format: int64
        message:
          type: string
    DlqJob:
      type: object
