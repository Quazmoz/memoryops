          type: string
          format: uuid
        payload_summary:
          type: string
        error:
          type: string
        retry_count:
          type: integer
        failed_at:
          type: [string, 'null']
          format: date-time
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          required: [database, redis, qdrant]
          properties:
            database:
              type: string
            redis:
              type: string
            qdrant:
              type: string
    SystemHealthResponse:
      type: object
      required: [status, checks, checked_at]
      properties:
        status:
          type: string
          enum: [ok, warn, error]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
        checked_at:
          type: string
          format: date-time
    HealthCheck:
      type: object
      required: [name, status, latency_ms, message]
      properties:
        name:
