    get:
      tags: [Agent Resources]
      operationId: getAgentResource
      summary: Read one versioned agent resource
      description: Reads the latest canonical Agent Library resource by kind, assistant target, and stable resource name.
      parameters:
        - $ref: '#/components/parameters/AgentResourceKind'
        - $ref: '#/components/parameters/AgentResourceAssistant'
        - $ref: '#/components/parameters/AgentResourceName'
      responses:
        '200':
          description: Agent resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Agent Resources]
      operationId: updateAgentResource
      summary: Update one agent resource and create a new version
      description: Updates metadata, body, rendered content, title, or description and creates a new immutable version snapshot. Metadata-only updates preserve existing rendered content.
      parameters:
        - $ref: '#/components/parameters/AgentResourceKind'
        - $ref: '#/components/parameters/AgentResourceAssistant'
        - $ref: '#/components/parameters/AgentResourceName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentResourceRequest'
      responses:
        '200':
          description: Agent resource updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Agent Resources]
      operationId: deleteAgentResource
      summary: Delete one agent resource
      description: Deletes the current resource and its version history. Deleting a skill also removes the compatibility row from legacy `agent_skills`.
      parameters:
        - $ref: '#/components/parameters/AgentResourceKind'
        - $ref: '#/components/parameters/AgentResourceAssistant'
        - $ref: '#/components/parameters/AgentResourceName'
      responses:
        '200':
          description: Agent resource deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agent-resources/{kind}/{assistant}/{name}/versions:
