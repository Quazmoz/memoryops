      summary: Discard a dead-letter queue job
      description: Deletes a failed processing job from the dead-letter queue.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: DLQ job discarded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/export:
