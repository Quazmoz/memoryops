  /v1/workspaces/{id}/audit:
    get:
      tags: [Audit]
      operationId: listAuditLog
      summary: List audit entries
      description: >-
        Returns cursor-paginated audit entries for workspace state changes.
        Supports stable ordering by (occurred_at, id) and a rich set of
        investigation filters. Payloads are redacted on read.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Limit'
        - { name: offset, in: query, schema: { type: integer, minimum: 0 }, description: Legacy offset pagination; prefer cursor (after). }
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string }, description: Single action filter (back-compatible). }
        - { name: actions, in: query, schema: { type: string }, description: Comma-separated list of actions. }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string, format: uuid } }
        - { name: target_name, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: source_ip, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string }, description: Comma-separated severities. }
        - { name: category, in: query, schema: { type: string }, description: Comma-separated categories. }
        - { name: success, in: query, schema: { type: boolean } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Inclusive lower bound (alias of from). }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string }, description: Free-text search across actor/target/request id/reason. }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/audit/actions:
    get:
      tags: [Audit]
      operationId: listAuditActions
      summary: List known audit actions
      description: Returns the catalog of audit actions, their categories, default severities, and whether each is a required (reliable) event.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Audit action catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditActionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/audit/export:
    get:
      tags: [Audit]
      operationId: exportAuditLog
      summary: Export audit entries
      description: >-
        Exports filtered, redacted audit entries as JSONL (default) or CSV. The
        same filters as the list endpoint apply. Results are bounded; if the cap
        is hit the response carries `x-audit-export-truncated: true` and the
        caller should narrow the date range. Exporting is itself audited.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: format, in: query, schema: { type: string, enum: [jsonl, csv], default: jsonl } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actions, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Exported audit data
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/audit/verify:
    post:
      tags: [Audit]
      operationId: verifyAuditLog
      summary: Verify audit hash chain
      description: Recomputes and verifies the per-workspace tamper-evident HMAC hash chain.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/audit/{audit_id}:
    get:
      tags: [Audit]
      operationId: getAuditEntry
      summary: Get a single audit entry
      description: Returns one redacted audit entry by id within the workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - { name: audit_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Audit entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/dlq:
    get:
      tags: [DLQ]
      operationId: listDlqJobs
      summary: List dead-letter queue jobs
      description: Lists failed processing jobs currently held in the workspace dead-letter queue.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: DLQ jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DlqJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/workspaces/{id}/dlq/{job_id}/retry:
    post:
      tags: [DLQ]
      operationId: retryDlqJob
      summary: Retry a dead-letter queue job
      description: Requeues a failed processing job from the dead-letter queue.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: DLQ job queued for retry
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/dlq/{job_id}:
    delete:
      tags: [DLQ]
      operationId: discardDlqJob
      summary: Discard a dead-letter queue job
      description: Deletes a failed processing job from the dead-letter queue.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: DLQ job discarded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/workspaces/{id}/export:
    get:
      tags: [Export]
      operationId: exportWorkspaceMemory
      summary: Stream a workspace memory export as JSONL
      description: Streams memory units as JSONL while excluding raw event payloads and embeddings.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: JSONL memory export
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/memory/{id}/provenance:
    get:
      tags: [Memory]
      operationId: getMemoryProvenance
      summary: Get memory provenance graph
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Provenance graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceGraph'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/memory/{id}/feedback:
    get:
      tags: [Memory]
      operationId: listMemoryFeedback
      summary: List retrieval feedback for a memory
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Retrieval feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Memory]
      operationId: submitMemoryFeedback
      summary: Submit retrieval feedback for a memory
      parameters:
        - $ref: '#/components/parameters/MemoryId'
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackRequest'
      responses:
        '200':
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Liveness check
      description: Confirms the API process is alive.
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Dependency readiness check
      description: Checks whether the API can reach Postgres, Redis, and Qdrant.
      security: []
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /health/system:
    get:
      tags: [Health]
      operationId: systemHealth
      summary: Structured system health check
      description: Returns dependency health checks with latency and diagnostic messages.
      security: []
      responses:
        '200':
          description: System health details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminTokenAuth:
      type: apiKey
      in: header
      name: x-admin-token
  parameters:
    After:
      name: after
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookWorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryId:
      name: query_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    ToolName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ToolVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AgentResourceKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [skill, agent, prompt, instruction]
    AgentResourceAssistant:
      name: assistant
      in: path
      required: true
      description: Target assistant runtime. Skill resources only allow `claude` or `gemini`; agents, prompts, and instructions allow all listed values.
      schema:
        type: string
        enum: [generic, openai, claude, gemini]
    AgentResourceName:
      name: name
      in: path
      required: true
      description: Stable lowercase resource identifier.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,63}$'
        maxLength: 64
    AgentResourceVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FlagId:
      name: flag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated credentials do not allow this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Request is syntactically valid but cannot be applied to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Feature is not implemented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ObservationRequest:
      type: object
      required: [workspace_id, content, agent_id]
      properties:
        workspace_id:
          type: string
          format: uuid
          description: Workspace to ingest into
        content:
          type: string
          minLength: 1
          maxLength: 8000
          description: Observation text
        agent_id:
          type: string
          description: Identifier of the agent authoring this observation
        user_id:
          type: string
          description: Optional user context
        repo:
          type: string
          description: Optional repository context (e.g. "org/repo")
        tags:
          type: array
          maxItems: 20
          items:
            type: string
          description: Optional tags to attach to the resulting memory
        importance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Override importance score (0.0–1.0). Omit to use rule-table scoring.
        source_ref:
          type: string
          description: Optional external reference (e.g. run id, URL)
    ObservationAccepted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
          description: Raw event id
        status:
          type: string
          enum: [queued]
    WebhookAccepted:
      type: object
      required: [event_id]
      properties:
        event_id:
          type: string
          format: uuid
    SlackEventEnvelope:
      oneOf:
        - $ref: '#/components/schemas/SlackUrlVerification'
        - $ref: '#/components/schemas/SlackEventCallback'
    SlackUrlVerification:
      type: object
      required: [type, challenge]
      properties:
        type:
          type: string
          enum: [url_verification]
        challenge:
          type: string
    SlackEventCallback:
      type: object
      required: [type, event]
      properties:
        type:
          type: string
          enum: [event_callback]
        event:
          oneOf:
            - $ref: '#/components/schemas/SlackMessageEvent'
            - $ref: '#/components/schemas/SlackReactionEvent'
    SlackMessageEvent:
      type: object
      required: [type, channel, user, text, ts]
      properties:
        type:
          type: string
          enum: [message, app_mention]
        subtype:
          # Expressed as oneOf rather than `enum: [message_changed, null]`: a
          # literal null inside an enum is valid OpenAPI 3.1 but crashes some
          # JSONPath-based linters. This form is semantically identical.
          oneOf:
            - type: string
              enum: [message_changed]
            - type: 'null'
        channel:
          type: string
        user:
          type: string
        text:
          type: string
        ts:
          type: string
        thread_ts:
          type: [string, 'null']
        message:
          type: object
          additionalProperties: true
    SlackReactionEvent:
      type: object
      required: [type, user, reaction, item]
      properties:
        type:
          type: string
          enum: [reaction_added]
        user:
          type: string
        reaction:
          type: string
        item:
          type: object
          required: [channel, ts]
          properties:
            channel:
              type: string
            ts:
              type: string
    WorkspacePromotionResponse:
      type: object
      required: [workspace_id, clusters_found, units_promoted, units_skipped]
      properties:
        workspace_id:
          type: string
          format: uuid
        clusters_found:
          type: integer
          minimum: 0
        units_promoted:
          type: integer
          minimum: 0
        units_skipped:
          type: integer
          minimum: 0
    Source:
      type: string
      enum: [github, slack, jira, linear]
    MemoryType:
      type: string
      enum: [episodic, semantic]
    ScopeVisibility:
      type: string
      enum: [private, workspace]
    SearchMode:
      type: string
      enum: [hybrid, vector, keyword]
    EntityType:
      type: string
      enum: [person, repo, branch, topic, file, team]
    AuditAction:
      type: string
      enum:
        - memory_created
        - memory_edited
        - memory_deleted
        - memory_restored
        - memory_pinned
        - memory_unpinned
        - memory_promoted
        - memory_merged
        - memory_embedded
        - memory_hard_deleted
        - memory_imported
        - memory_exported
        - importance_overridden
        - key_created
        - key_revoked
        - config_updated
        - workspace_config_updated
        - publish
        - workspace.promote
        - workspace_created
        - workspace_bootstrap
        - workspace_deleted
        - workspace_reindexed
        - integration_added
        - integration_updated
        - integration_removed
        - integration_webhook_secret_changed
        - contradiction_resolved
        - contradiction_dismissed
        - retrieval_feedback
        - observation_ingested
        - user_erasure
        - tool_created
        - tool_updated
        - tool_deleted
        - tool_rolled_back
        - tool_invoked
        - tool_secret_revealed
        - agent_resource_created
        - agent_resource_updated
        - agent_resource_deleted
        - agent_resource_rolled_back
        - auth_failed
        - audit_exported
    IntegrationStatus:
      type: string
      enum: [active, degraded, failing]
    MemoryScope:
      type: object
      required: [workspace_id]
      properties:
        workspace_id:
          type: string
          format: uuid
        source:
          type: string
        actor:
          type: string
        agent_id:
          type: [string, 'null']
        user_id:
          type: [string, 'null']
        repo:
          type: [string, 'null']
    Entity:
      type: object
      required: [entity_type, value, confidence]
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        value:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
    MemoryUnit:
      type: object
      required:
        - id
        - workspace_id
        - scope
        - memory_type
        - scope_visibility
        - content
        - entities
        - importance_score
        - importance_overridden
        - source_events
        - decay_score
        - pinned
        - tags
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/MemoryScope'
        memory_type:
          $ref: '#/components/schemas/MemoryType'
        scope_visibility:
          $ref: '#/components/schemas/ScopeVisibility'
        content:
          type: string
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        importance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        importance_overridden:
          type: boolean
        source_events:
          type: array
          items:
            type: string
            format: uuid
        embedding_id:
          type: [string, 'null']
        token_count:
          type: [integer, 'null']
        decay_score:
          type: number
          format: float
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
        deleted_at:
          type: [string, 'null']
          format: date-time
        last_accessed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryVersion:
      type: object
      required: [id, memory_id, workspace_id, version, content, importance_score, tags, edited_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        memory_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        version:
          type: integer
        content:
          type: string
        importance_score:
          type: number
          format: float
        tags:
          type: array
          items:
            type: string
        edited_by:
          type: string
        created_at:
          type: string
          format: date-time
    MemoryPatchRequest:
      type: object
      additionalProperties: false
      properties:
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
        content:
          type: string
        importance_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
    BulkMemoryRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pin, delete]
        ids:
          type: array
          items:
            type: string
            format: uuid
    BulkMemoryResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0
    MemoryMergeRequest:
      type: object
      required: [source_ids, content]
      properties:
        source_ids:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid
        content:
          type: string
    MemoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryUnit'
        next_cursor:
          type: [string, 'null']
    MemorySearchRequest:
      type: object
      required: [query, workspace_id, mode]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        workspace_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SearchMode'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        agent_id:
          type: string
        user_id:
          type: string
        repo:
          type: string
        scope:
          $ref: '#/components/schemas/ScopeFilter'
        memory_types:
          type: array
          items:
            $ref: '#/components/schemas/MemoryType'
        filters:
          $ref: '#/components/schemas/MemorySearchFilters'
        as_of:
          type: string
          format: date-time
        include_workspace_pool:
          type: boolean
          default: false
    ScopeFilter:
      type: object
      properties:
        agent_id:
          type: string
        user_id:
          type: string
        repo:
          type: string
    MemorySearchFilters:
      type: object
      properties:
        memory_type:
          $ref: '#/components/schemas/MemoryType'
        source:
          type: string
        min_importance:
          type: number
          format: float
          minimum: 0
          maximum: 1
        pinned:
          type: boolean
        tags:
          type: array
          items:
            type: string
    MemorySearchResponse:
      type: object
      required: [results, total, query_id]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemorySearchResult'
        total:
          type: integer
          minimum: 0
        query_id:
          type: string
          format: uuid
    MemorySearchResult:
      type: object
      required: [memory, score, rank]
      properties:
        memory:
          $ref: '#/components/schemas/MemoryUnit'
        score:
          type: number
          format: float
        rank:
          type: integer
          minimum: 1
    RetrievalRequest:
      type: object
      required: [query]
      properties:
        scope:
          anyOf:
            - $ref: '#/components/schemas/MemoryScope'
            - type: 'null'
        query:
          type: string
          minLength: 1
          maxLength: 2000
        mode:
          $ref: '#/components/schemas/SearchMode'
        agent_id:
          type: string
        user_id:
          type: string
        repo:
          type: string
        as_of:
          type: string
          format: date-time
