  /v1/agent-resources:
    get:
      tags: [Agent Resources]
      operationId: listAgentResources
      summary: List versioned agent resources
      description: Returns canonical Agent Library resources for the authenticated workspace. Resources include skills, agent profiles, prompts, and reusable instructions. Skill resources are limited to Claude and Gemini targets; other resource kinds may target generic, OpenAI, Claude, or Gemini agents.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [skill, agent, prompt, instruction]
        - name: assistant
          in: query
          required: false
          schema:
            type: string
            enum: [generic, openai, claude, gemini]
      responses:
        '200':
          description: Agent resource library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResourceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Agent Resources]
      operationId: createAgentResource
      summary: Create a versioned agent resource
      description: Creates v1 of a canonical Agent Library resource. The `(workspace_id, kind, assistant, name)` tuple must be unique. If `content` is omitted, markdown is rendered from `kind`, `title`, `description`, and `body`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentResourceRequest'
      responses:
        '200':
          description: Agent resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
