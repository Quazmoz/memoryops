          type: [string, 'null']
          format: date-time
        newest_memory_at:
          type: [string, 'null']
          format: date-time
    WorkspaceConfig:
      type: object
      additionalProperties: true
      properties:
        promotion_threshold:
          type: number
          format: float
          minimum: 0.50
          maximum: 1.00
        dedup_cosine_threshold:
          type: number
          format: float
          minimum: 0.80
          maximum: 0.99
        access_count_trigger:
          type: integer
          minimum: 1
        half_life_days:
          type: number
          format: float
          description: Legacy decay configuration retained for backward compatibility.
        decay_rate_episodic:
          type: number
          format: float
        decay_rate_semantic:
          type: number
          format: float
        llm_provider:
          type: [string, 'null']
        llm_model:
          type: [string, 'null']
        embedding_provider:
          type: [string, 'null']
        embedding_model:
          type: [string, 'null']
        decay_half_life_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: >
            Half-life in days for the memory decay formula.
            Defaults to 30 when null. Lower values cause faster decay.
          example: 30
        pruning_threshold:
          type: [number, 'null']
          format: float
          minimum: 0.01
          maximum: 0.50
          description: >
            Decay score below which a memory is soft-deleted.
            Defaults to 0.10 when null.
          example: 0.10
        retention_max_age_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: >
            Maximum age in days before memories become eligible for compliance retention purge.
            Leave null to disable automatic retention purging.
          example: 365
        skill_version_retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: >
            Maximum age in days before historical skill versions are pruned.
            The latest snapshot per skill is always retained. Leave null to disable pruning.
          example: 90
        compliance_hard_purge:
          type: boolean
          description: >
            When true, compliance deletion also hard-deletes the originating raw events.
            When false, only memory units are affected.
        compliance_mode:
          type: boolean
          description: >
            When true, skill create, update, and rollback operations require a non-empty change note.
        sub_agent_pools:
          type: array
          items:
            type: string
          description: Agent IDs whose published workspace-pool memories are inherited by retrieval/search.
