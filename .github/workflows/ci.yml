name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memoryops_test
          POSTGRES_USER: memoryops
          POSTGRES_PASSWORD: memoryops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoryops -d memoryops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
          - 6334:6334
    env:
      DATABASE_URL: postgres://memoryops:memoryops@localhost:5432/memoryops_test
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6334
      SQLX_OFFLINE: true
      RUST_LOG: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Audit dependencies
        run: cargo audit

      - name: Install sqlx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run

      - name: Test
        run: cargo test --workspace --all-features

      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80 --lcov --output-path lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      - name: E2E tests
        run: |
          if find . -path '*/tests/e2e.rs' -o -path '*/tests/e2e/*.rs' | grep -q .; then
            docker compose -f docker-compose.test.yml up -d
            cargo test --workspace --test e2e --all-features
            docker compose -f docker-compose.test.yml down -v
          else
            echo "No e2e tests are present in M1."
          fi

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Lint OpenAPI contract
        run: npx --yes @stoplight/spectral-cli lint docs/openapi.yaml

      - name: Check backend route parity
        run: node scripts/check-openapi-routes.mjs

      - name: Check generated frontend API contract
        run: node scripts/generate-openapi-client.mjs --check

  integration-tests:
    name: Ignored integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://memoryops:memoryops@localhost:15432/memoryops_test
      REDIS_URL: redis://localhost:16379
      QDRANT_URL: http://localhost:16333
      APP_SECRET_KEY: test-secret-key-for-unit-tests
      RUST_LOG: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start dependencies
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install sqlx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run

      - name: Run ignored tests
        run: cargo test --workspace --all-features -- --include-ignored

      - name: Stop dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
